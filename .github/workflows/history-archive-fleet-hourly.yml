name: Hourly fleet edit-history preservation

on:
  schedule:
    - cron: "11 * * * *"
    - cron: "37 4 * * *" # daily below-threshold tail flush; separate from hourly
  workflow_dispatch:
    inputs:
      review_archive_pilot:
        description: 'Opt-in synthetic review edits to private archive proof, no normal fleet scan'
        type: boolean
        required: false
        default: false
      pr_body_pages_pilot:
        description: 'Opt-in two remote-verified private PR-body candidate pages (M6 only)'
        type: boolean
        required: false
        default: false
      pr_body_reconciliation:
        description: 'Run next real PR-body reconciliation for one private source (manual only)'
        type: boolean
        required: false
        default: false
      pr_body_positive_canary:
        description: 'Opt-in positive PR-body edits from remote-verified private M6 frontier'
        type: boolean
        required: false
        default: false
      permission_probe:
        description: 'Check source App PR read access only (no fleet scan)'
        type: boolean
        required: false
        default: false
      start_source_index:
        description: 'Manual bounded recovery start index (1-based; default whole inventory)'
        type: number
        required: false
        default: 1
      end_source_index:
        description: 'Manual bounded recovery end index (0 means full inventory)'
        type: number
        required: false
        default: 0
      full_collection:
        description: 'Collect all accessible Issue/comment edits, ignoring hourly 80-edit threshold'
        type: boolean
        required: false
        default: false
      tail_collection:
        description: 'Run an explicit below-threshold tail flush; uses durable per-source checkpoints'
        type: boolean
        required: false
        default: false

# A single trusted public runner handles the fleet; source repos need no workflows.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.permission_probe || inputs.review_archive_pilot || inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation) && 'history-archive-source-permission-probe' || 'history-archive-hourly-fleet' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-pr-read-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.permission_probe || inputs.review_archive_pilot || inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create source Issues and PR read token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source-pr-read
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          permission-issues: read
          permission-pull-requests: read
      - name: Verify source PR review and commit-comment read access without logging content
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-pr-read.outputs.token }}
        run: |
          set -euo pipefail
          echo 'Probe checkpoint: pull-request GET'
          gh api repos/kinoko34077/github-history-archive/pulls/34 > /dev/null
          echo 'Probe checkpoint: pull-request reviews'
          gh api repos/kinoko34077/github-history-archive/pulls/34/reviews > /dev/null
          echo 'Probe checkpoint: inline review comments'
          gh api repos/kinoko34077/github-history-archive/pulls/34/comments > /dev/null
          echo 'Probe checkpoint: repository commit comments'
          gh api repos/kinoko34077/github-history-archive/comments > /dev/null
          echo 'Probe checkpoint: GraphQL PR/review edit-history capabilities'
          echo 'Probe checkpoint: GraphQL PR baseline'
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id}}}' -f owner=kinoko34077 -f name=github-history-archive -F number=34 | jq -e '.errors == null and .data.repository.pullRequest.id != null' > /dev/null
          echo 'Probe checkpoint: GraphQL PR body edit history'
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id userContentEdits(first:1){nodes{id}}}}}' -f owner=kinoko34077 -f name=github-history-archive -F number=34 | jq -e '.errors == null and (.data.repository.pullRequest.userContentEdits.nodes | type) == "array"' > /dev/null
          echo 'Probe checkpoint: GraphQL review body edit history'
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id reviews(first:1){nodes{id userContentEdits(first:1){nodes{id}}}}}}}' -f owner=kinoko34077 -f name=github-history-archive -F number=34 | jq -e '.errors == null and (.data.repository.pullRequest.reviews.nodes | type) == "array"' > /dev/null
          echo 'Source App PR/review edit-history and REST commit-comment metadata reads completed; GraphQL repository.commitComments not attested.' >> "$GITHUB_STEP_SUMMARY"

      # One-time opt-in M5 private evidence capture. Never runs in cron/default collector.
      - name: Create archive-only write token for positive pilot
        if: ${{ inputs.review_archive_pilot }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: review-pilot-write
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          repositories: github-history-archive
          permission-contents: write
      - name: Check out trusted private archive main for review pilot
        if: ${{ inputs.review_archive_pilot }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: main
          token: ${{ steps.review-pilot-write.outputs.token }}
          path: private-archive
          persist-credentials: true
      - name: Preserve verified edited review and inline histories to private pilot branch
        if: ${{ inputs.review_archive_pilot }}
        shell: bash
        working-directory: private-archive
        env:
          FLEET_SOURCE_TOKEN: ${{ steps.source-pr-read.outputs.token }}
          ARCHIVE_CHECKOUT_ROOT: .
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          git config user.name "github-history-archive automation"
          git config user.email "github-history-archive-automation@users.noreply.github.com"
          git switch -q -c pilot/v02-source-app-edited-reviews-20261103
          python -m history_archive.v02_review_pilot
          git add -A -- archive/
          mapfile -t staged < <(git diff --cached --name-only)
          if [[ "${#staged[@]}" -ne 4 ]]; then
            echo "::error::Unexpected private review evidence file count."
            exit 2
          fi
          for path in "${staged[@]}"; do
            if [[ "$path" != archive/* ]]; then
              echo "::error::Unexpected file outside private archive evidence."
              exit 2
            fi
          done
          if ! git diff --cached --check > /dev/null 2>&1; then
            echo "::error::Private archive evidence fails Git whitespace check."
            exit 2
          fi
          git commit -qm "archive(M5): save source-App verified review and inline edited histories"
          git push -q origin HEAD:refs/heads/pilot/v02-source-app-edited-reviews-20261103
          echo 'M5 pilot: two review-body and two inline revisions saved on private Git branch; independent readback required.' >> "$GITHUB_STEP_SUMMARY"


      # M6 source-account-candidate reconciliation; explicit opt-in, never on cron/default.
      - name: Create archive-only private checkpoint token for M6
        if: ${{ inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: m6-private-write
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          repositories: github-history-archive
          permission-contents: write
      - name: Check out isolated private archive evidence for M6/M7
        if: ${{ inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: ${{ (inputs.pr_body_positive_canary || inputs.pr_body_reconciliation) && 'pilot/v02-multipage-pr-body-20261103' || 'main' }}
          token: ${{ steps.m6-private-write.outputs.token }}
          path: m6-private-archive
          persist-credentials: true
      - name: Check out reviewed private archive main code for M7
        if: ${{ inputs.pr_body_positive_canary || inputs.pr_body_reconciliation }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: main
          token: ${{ steps.m6-private-write.outputs.token }}
          path: m7-trusted-code
          persist-credentials: false
      - name: Execute two remote-verified PR-body candidate pages, without logging private content
        if: ${{ inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation }}
        shell: bash
        working-directory: m6-private-archive
        env:
          FLEET_SOURCE_TOKEN: ${{ steps.source-pr-read.outputs.token }}
          ARCHIVE_CHECKOUT_ROOT: .
          CANARY_RESUME: ${{ inputs.pr_body_positive_canary }}
          PR_BODY_RECONCILIATION: ${{ inputs.pr_body_reconciliation }}
        run: |
          set -euo pipefail
          git config user.name "github-history-archive automation"
          git config user.email "github-history-archive-automation@users.noreply.github.com"
          if [[ "$CANARY_RESUME" == "true" ]]; then
            # Run reviewed main code against existing isolated private remote evidence.
            # The Python runner verifies exact remote cursor bytes before source reads.
            git switch -q -C pilot/v02-multipage-pr-body-20261103
            export PYTHONPATH=../m7-trusted-code/src
            python -m history_archive.v02_pr_body_pilot --resume-positive-canary
            echo 'M7 canary: positive PR-body edit and private remote receipts accepted; no private content emitted.' >> "$GITHUB_STEP_SUMMARY"
          else
            export PYTHONPATH=src
            git switch -q -c pilot/v02-multipage-pr-body-20261103
            python -m history_archive.v02_pr_body_pilot
            echo 'M6 PR-body two-page private remote ACK accepted only by bounded source+checkpoint contract.' >> "$GITHUB_STEP_SUMMARY"
          fi

  archive-fleet:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.permission_probe && !inputs.review_archive_pilot && !inputs.pr_body_pages_pilot && !inputs.pr_body_positive_canary && !inputs.pr_body_reconciliation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Assert existing archive GitHub App is configured
        shell: bash
        env:
          SOURCE_ID: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          SOURCE_KEY: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          ARCHIVE_ID: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          ARCHIVE_KEY: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_ID" || -z "$SOURCE_KEY" ]]; then
            echo "::error::The shared GitHub App is not configured in this runner."
            exit 1
          fi
          if [[ -z "$ARCHIVE_ID" || -z "$ARCHIVE_KEY" ]]; then
            echo "::error::The shared GitHub App is not configured in this runner."
            exit 1
          fi

      - name: Create source Issues-and-PR-read token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: fleet-source
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          permission-issues: read
          permission-pull-requests: read

      - name: Create archive Contents-write token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: archive-write
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          repositories: github-history-archive
          permission-contents: write

      - name: Check out current private archive and shared collector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: main
          token: ${{ steps.archive-write.outputs.token }}
          path: history-archive
          persist-credentials: true

      - name: Fleet sweep with per-repository retries and durable checkpoints
        shell: bash
        working-directory: history-archive
        env:
          FLEET_SOURCE_TOKEN: ${{ steps.fleet-source.outputs.token }}
          MANUAL_FIRST: ${{ inputs.start_source_index }}
          MANUAL_LAST: ${{ inputs.end_source_index }}
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          git config user.name "github-history-archive automation"
          git config user.email "github-history-archive-automation@users.noreply.github.com"
          total="$(grep -cvE '^[[:space:]]*(#|$)' config/fleet-repositories.txt)"
          # Only manual dispatch may narrow a source range. Scheduled sweeps always use all sources.
          first=1
          last="$total"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            first="${MANUAL_FIRST:-1}"
            last="${MANUAL_LAST:-0}"
            if [[ ! "$first" =~ ^[1-9][0-9]*$ || ! "$last" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Invalid bounded source range."
              exit 2
            fi
            if [[ "$last" == "0" ]]; then last="$total"; fi
            if (( first > last || last > total )); then
              echo "::error::Source range exceeds configured inventory."
              exit 2
            fi
          fi
          range_count=$((last - first + 1))
          failures=0
          success_count=0
          recovered_count=0
          scan_mode=hourly
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && ( "${{ inputs.full_collection }}" == "true" || "${{ inputs.tail_collection }}" == "true" ) ]] || [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "37 4 * * *" ]]; then
            scan_mode=tail
          fi
          # Temporary sanitized per-attempt diagnostics only; never source content.
          safe_scan_log="$(mktemp)"
          trap 'rm -f "$safe_scan_log"' EXIT
          scan_args=()
          if [[ "$scan_mode" == "tail" ]]; then scan_args+=(--all); fi
          for index in $(seq "$first" "$last"); do
            scanned=0
            for scan_attempt in 1 2 3; do
              if python -m history_archive.fleet_cli --root . \
                  --sources config/fleet-repositories.txt "${scan_args[@]}" --source-index "$index" 2>&1 \
                  | jq -Rc 'try (fromjson | del(.repository, .error, .path, .source)) catch {"collector_output":"redacted"}' | tee "$safe_scan_log"; then
                scanned=1
                if [[ "$scan_attempt" -gt 1 ]]; then recovered_count=$((recovered_count + 1)); fi
                break
              fi
              # The collector already waits when GitHub supplies a bounded reset.
              # If still rate-limited, preserve the source failure and defer its retry.
              if grep -Eq '"error_code":"(graphql_rate_limit|rate_limited(_until_[0-9TZ]+)?)"' "$safe_scan_log"; then
                echo "::warning::Source index $index is rate-limited; no blind immediate retry."
                break
              fi
              echo "::warning::Source index $index scan failed (attempt $scan_attempt/3)."
              if [[ "$scan_attempt" -lt 3 ]]; then
                sleep "$((scan_attempt * 15))"
              fi
            done
            if [[ "$scanned" -eq 1 ]]; then
              success_count=$((success_count + 1))
            else
              failures=$((failures + 1))
              echo "::error::Source index $index could not be scanned after three attempts."
            fi
            git add -A -- archive/ tracking/ 2>/dev/null || git add -A -- archive/ 2>/dev/null
            if ! git diff --cached --quiet; then
              unexpected="$(git diff --cached --name-only | grep -Ev '^(archive|tracking)/' || true)"
              if [[ -n "$unexpected" ]]; then
                echo "::error::Unexpected staged path outside archive/tracking."
                exit 2
              fi
              git commit -qm "archive: $scan_mode checkpoint $index/$total"
              pushed=0
              for attempt in 1 2 3 4; do
                if git pull -q --rebase origin main >/dev/null 2>&1 && git push -q origin HEAD:main >/dev/null 2>&1; then
                  pushed=1
                  break
                fi
                git rebase --abort >/dev/null 2>&1 || true
                sleep "$((attempt * 2))"
              done
              if [[ "$pushed" -ne 1 ]]; then
                echo "::error::Checkpoint push failed at source index $index."
                exit 1
              fi
            fi
            echo "Fleet $scan_mode checkpoint $index/$total processed."
          done
          {
            echo "### Archive fleet collection receipt"
            echo "- Mode: $scan_mode"
            echo "- Configured sources: $total"
            echo "- Attempted source indices: $first-$last (count: $range_count)"
            echo "- Succeeded: $success_count"
            echo "- Recovered after retry: $recovered_count"
            echo "- Failed after retries: $failures"
            echo "- Archive checkpoint writes: see committed archive history"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failures" -ne 0 ]]; then
            echo "::error::$failures sources were not completely scanned."
            exit 1
          fi

      - name: Report private fleet scan freshness as aggregate counts
        if: always()
        shell: bash
        working-directory: history-archive
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          if [[ ! -f config/fleet-repositories.txt ]]; then
            echo "::warning::Fleet inventory not available for health report."
            exit 0
          fi
          if ! python -m history_archive.fleet_health \
              --root . --sources config/fleet-repositories.txt --max-age-hours 24 \
              | jq -r '["### Durable fleet scan health", ("- Sources: " + (.sources|tostring)), ("- Recent success: " + (.recent_success|tostring)), ("- Stale: " + (.stale_success|tostring)), ("- No success: " + (.never_succeeded|tostring)), ("- Failed: " + (.failed_last_attempt|tostring)), ("- Deferred: " + (.deferred|tostring))] | .[]' \
              >> "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Fleet health report unavailable; no success inferred."
          fi

      - name: Fail run if a source was not fully checked
        if: always()
        shell: bash
        env:
          FLEET_SCAN_FAILED: ${{ env.FLEET_SCAN_FAILED }}
        run: |
          if [[ "$FLEET_SCAN_FAILED" == "1" ]]; then
            echo "::error::At least one source could not be scanned; partial evidence was preserved."
            exit 1
          fi

