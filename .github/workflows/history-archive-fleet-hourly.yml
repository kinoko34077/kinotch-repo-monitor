name: Hourly fleet edit-history preservation

on:
  schedule:
    - cron: "11 * * * *"
    - cron: "37 4 * * *" # daily below-threshold tail flush; separate from hourly
  workflow_dispatch:
    inputs:
      review_archive_pilot:
        description: 'Opt-in synthetic review edits to private archive proof, no normal fleet scan'
        type: boolean
        required: false
        default: false
      pr_body_pages_pilot:
        description: 'Opt-in two remote-verified private PR-body candidate pages (M6 only)'
        type: boolean
        required: false
        default: false
      pr_body_reconciliation:
        description: 'Run next real PR-body reconciliation for one private source (manual only)'
        type: boolean
        required: false
        default: false
      pr_body_positive_canary:
        description: 'Opt-in positive PR-body edits from remote-verified private M6 frontier'
        type: boolean
        required: false
        default: false
      permission_probe:
        description: 'Check source App PR read access only (no fleet scan)'
        type: boolean
        required: false
        default: false
      start_source_index:
        description: 'Manual bounded recovery start index (1-based; default whole inventory)'
        type: number
        required: false
        default: 1
      end_source_index:
        description: 'Manual bounded recovery end index (0 means full inventory)'
        type: number
        required: false
        default: 0
      manual_all_seven:
        description: 'Manual seven-kind archive: existing Issue fleet plus five v0.2 typed lanes'
        type: boolean
        required: false
        default: false
      manual_v02_only:
        description: 'Only resume five v0.2 lanes; never rerun the independent v0.1 Issue fleet'
        type: boolean
        required: false
        default: false
      manual_v02_pages:
        description: 'Bounded PR candidate pages per source/type each cycle (1-5)'
        type: number
        required: false
        default: 2
      manual_v02_cycles:
        description: 'Sequential 5-page cycles within one runner (1-12), stop at COMPLETE'
        type: number
        required: false
        default: 1
      manual_v02_pause_seconds:
        description: 'Pause between verified cycles in seconds (0-60)'
        type: number
        required: false
        default: 5
      manual_reconcile_complete:
        description: 'Explicitly restart already-complete v0.2 lanes (default resume/skip)'
        type: boolean
        required: false
        default: false
      manual_inventory_only:
        description: 'Refresh the shared inventory without starting either collector'
        type: boolean
        required: false
        default: false
      manual_reconcile_before:
        description: 'Optional UTC cutoff: revisit only older completed v0.2 lanes'
        type: string
        required: false
        default: ''
      full_collection:
        description: 'Collect all accessible Issue/comment edits, ignoring hourly 80-edit threshold'
        type: boolean
        required: false
        default: false
      tail_collection:
        description: 'Run an explicit below-threshold tail flush; uses durable per-source checkpoints'
        type: boolean
        required: false
        default: false

# A single trusted public runner handles the fleet; source repos need no workflows.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.permission_probe || inputs.review_archive_pilot || inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation) && 'history-archive-source-permission-probe' || 'history-archive-hourly-fleet' }}
  cancel-in-progress: false

permissions:
  contents: read

# Code authority is independent of the changing evidence/inventory commit.
# Advance this one reviewed ref when accepting collector-code changes.
env:
  ARCHIVE_COLLECTOR_REF: '0fb6c5af93b3b966259f7157f87999495f9385cb'

jobs:
  source-pr-read-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.permission_probe || inputs.review_archive_pilot || inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create source Issues and PR read token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source-pr-read
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          permission-issues: read
          permission-pull-requests: read
      - name: Verify source PR review and commit-comment read access without logging content
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-pr-read.outputs.token }}
        run: |
          set -euo pipefail
          echo 'Probe checkpoint: pull-request GET'
          gh api repos/kinoko34077/github-history-archive/pulls/34 > /dev/null
          echo 'Probe checkpoint: pull-request reviews'
          gh api repos/kinoko34077/github-history-archive/pulls/34/reviews > /dev/null
          echo 'Probe checkpoint: inline review comments'
          gh api repos/kinoko34077/github-history-archive/pulls/34/comments > /dev/null
          echo 'Probe checkpoint: repository commit comments'
          gh api repos/kinoko34077/github-history-archive/comments > /dev/null
          echo 'Probe checkpoint: GraphQL PR/review edit-history capabilities'
          echo 'Probe checkpoint: GraphQL PR baseline'
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id}}}' -f owner=kinoko34077 -f name=github-history-archive -F number=34 | jq -e '.errors == null and .data.repository.pullRequest.id != null' > /dev/null
          echo 'Probe checkpoint: GraphQL PR body edit history'
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id userContentEdits(first:1){nodes{id}}}}}' -f owner=kinoko34077 -f name=github-history-archive -F number=34 | jq -e '.errors == null and (.data.repository.pullRequest.userContentEdits.nodes | type) == "array"' > /dev/null
          echo 'Probe checkpoint: GraphQL review body edit history'
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id reviews(first:1){nodes{id userContentEdits(first:1){nodes{id}}}}}}}' -f owner=kinoko34077 -f name=github-history-archive -F number=34 | jq -e '.errors == null and (.data.repository.pullRequest.reviews.nodes | type) == "array"' > /dev/null
          echo 'Source App PR/review edit-history and REST commit-comment metadata reads completed; GraphQL repository.commitComments not attested.' >> "$GITHUB_STEP_SUMMARY"

      # One-time opt-in M5 private evidence capture. Never runs in cron/default collector.
      - name: Create archive-only write token for positive pilot
        if: ${{ inputs.review_archive_pilot }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: review-pilot-write
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          repositories: github-history-archive
          permission-contents: write
      - name: Check out trusted private archive main for review pilot
        if: ${{ inputs.review_archive_pilot }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: main
          token: ${{ steps.review-pilot-write.outputs.token }}
          path: private-archive
          persist-credentials: true
      - name: Preserve verified edited review and inline histories to private pilot branch
        if: ${{ inputs.review_archive_pilot }}
        shell: bash
        working-directory: private-archive
        env:
          FLEET_SOURCE_TOKEN: ${{ steps.source-pr-read.outputs.token }}
          ARCHIVE_CHECKOUT_ROOT: .
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          git config user.name "github-history-archive automation"
          git config user.email "github-history-archive-automation@users.noreply.github.com"
          git switch -q -c pilot/v02-source-app-edited-reviews-20261103
          python -m history_archive.v02_review_pilot
          git add -A -- archive/
          mapfile -t staged < <(git diff --cached --name-only)
          if [[ "${#staged[@]}" -ne 4 ]]; then
            echo "::error::Unexpected private review evidence file count."
            exit 2
          fi
          for path in "${staged[@]}"; do
            if [[ "$path" != archive/* ]]; then
              echo "::error::Unexpected file outside private archive evidence."
              exit 2
            fi
          done
          if ! git diff --cached --check > /dev/null 2>&1; then
            echo "::error::Private archive evidence fails Git whitespace check."
            exit 2
          fi
          git commit -qm "archive(M5): save source-App verified review and inline edited histories"
          git push -q origin HEAD:refs/heads/pilot/v02-source-app-edited-reviews-20261103
          echo 'M5 pilot: two review-body and two inline revisions saved on private Git branch; independent readback required.' >> "$GITHUB_STEP_SUMMARY"


      # M6 source-account-candidate reconciliation; explicit opt-in, never on cron/default.
      - name: Create archive-only private checkpoint token for M6
        if: ${{ inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: m6-private-write
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          repositories: github-history-archive
          permission-contents: write
      - name: Check out isolated private archive evidence for M6/M7
        if: ${{ inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: ${{ (inputs.pr_body_positive_canary || inputs.pr_body_reconciliation) && 'pilot/v02-multipage-pr-body-20261103' || 'main' }}
          token: ${{ steps.m6-private-write.outputs.token }}
          path: m6-private-archive
          persist-credentials: true
      - name: Check out reviewed private archive main code for M7
        if: ${{ inputs.pr_body_positive_canary || inputs.pr_body_reconciliation }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: main
          token: ${{ steps.m6-private-write.outputs.token }}
          path: m7-trusted-code
          persist-credentials: false
      - name: Execute two remote-verified PR-body candidate pages, without logging private content
        if: ${{ inputs.pr_body_pages_pilot || inputs.pr_body_positive_canary || inputs.pr_body_reconciliation }}
        shell: bash
        working-directory: m6-private-archive
        env:
          FLEET_SOURCE_TOKEN: ${{ steps.source-pr-read.outputs.token }}
          ARCHIVE_CHECKOUT_ROOT: .
          CANARY_RESUME: ${{ inputs.pr_body_positive_canary }}
          PR_BODY_RECONCILIATION: ${{ inputs.pr_body_reconciliation }}
        run: |
          set -euo pipefail
          git config user.name "github-history-archive automation"
          git config user.email "github-history-archive-automation@users.noreply.github.com"
          if [[ "$PR_BODY_RECONCILIATION" == "true" ]]; then
            # Real repeat collection over the previously verified private frontier.
            # Source reads require a short-lived PR-read App token.
            # Writes are scoped to an archive-only private branch.
            git switch -q -C pilot/v02-multipage-pr-body-20261103
            export PYTHONPATH=../m7-trusted-code/src
            python -m history_archive.v02_pr_body_pilot --recrawl-pr-body
            echo 'M7 live one-source PR-body reconciliation executed; verify private remote receipt and edit-ID coverage.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CANARY_RESUME" == "true" ]]; then
            # Run reviewed main code against existing isolated private remote evidence.
            # The Python runner verifies exact remote cursor bytes before source reads.
            git switch -q -C pilot/v02-multipage-pr-body-20261103
            export PYTHONPATH=../m7-trusted-code/src
            python -m history_archive.v02_pr_body_pilot --resume-positive-canary
            echo 'M7 canary: positive PR-body edit and private remote receipts accepted; no private content emitted.' >> "$GITHUB_STEP_SUMMARY"
          else
            export PYTHONPATH=src
            git switch -q -c pilot/v02-multipage-pr-body-20261103
            python -m history_archive.v02_pr_body_pilot
            echo 'M6 PR-body two-page private remote ACK accepted only by bounded source+checkpoint contract.' >> "$GITHUB_STEP_SUMMARY"
          fi

  inventory-refresh:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (!inputs.permission_probe && !inputs.review_archive_pilot && !inputs.pr_body_pages_pilot && !inputs.pr_body_positive_canary && !inputs.pr_body_reconciliation)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      generation: ${{ steps.refresh.outputs.generation }}
      allowed_indices: ${{ steps.refresh.outputs.allowed_indices }}
      mode: ${{ steps.refresh.outputs.mode }}
    steps:
      - name: Create existing read-only source App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source-read
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          permission-issues: read
          permission-pull-requests: read
      - name: Create existing archive-only private write token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: archive-write
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          repositories: github-history-archive
          permission-contents: write
      - name: Check out the reviewed immutable collector code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: ${{ env.ARCHIVE_COLLECTOR_REF }}
          token: ${{ steps.archive-write.outputs.token }}
          path: history-collector
          persist-credentials: false
      - name: Check out private archive for the single inventory refresh
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: main
          token: ${{ steps.archive-write.outputs.token }}
          path: history-inventory
          persist-credentials: true
      - name: Refresh and verify the shared source inventory once
        id: refresh
        shell: bash
        working-directory: history-inventory
        env:
          FLEET_SOURCE_TOKEN: ${{ steps.source-read.outputs.token }}
        run: |
          set -euo pipefail
          if [[ "$(git -C ../history-collector rev-parse HEAD)" != "$ARCHIVE_COLLECTOR_REF" ]] || [[ -n "$(git -C ../history-collector status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Reviewed collector checkout is not verified"; exit 1
          fi
          export PYTHONPATH=../history-collector/src
          git config user.name "github-history-archive automation"
          git config user.email "github-history-archive-automation@users.noreply.github.com"
          mode=REFRESHED
          if ! summary=$(python -P -B -m history_archive.inventory_commit refresh --checkout .); then
            # A failed inventory publication never licenses a stale blind scan.
            # Re-read the current remote and attest the remaining IDs using a
            # fresh complete source App listing. This recovery does not publish.
            if [[ -n "$(git status --porcelain --untracked-files=all)" ]] ||
               ! git fetch -q --no-tags origin refs/heads/main 2>/dev/null ||
               ! git switch -q --detach FETCH_HEAD 2>/dev/null ||
               ! summary=$(python -P -B -m history_archive.inventory_commit recover --checkout .); then
              echo "::error::Shared source inventory and safe recovery unverified"
              exit 1
            fi
            if ! printf '%s' "$summary" | jq -e '.refresh_mode == "DEGRADED"' >/dev/null; then
              echo "::error::Invalid degraded inventory receipt"; exit 1
            fi
            mode=DEGRADED
            echo "::warning::Inventory update deferred; collecting only reverified existing sources."
          fi
          generation=$(printf '%s' "$summary" | jq -er 'select(.state == "VERIFIED") | .generation')
          allowed=$(printf '%s' "$summary" | jq -ec 'select(.state == "VERIFIED") | .available_indices | select(type == "array")')
          if [[ ! "$generation" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid verified inventory generation"
            exit 1
          fi
          {
            echo "generation=$generation"
            echo "allowed_indices=$allowed"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"
          if [[ "$mode" == DEGRADED && "${{ inputs.manual_inventory_only }}" == true ]]; then
            echo "::warning::Inventory-only refresh remains incomplete."; exit 1
          fi

  archive-fleet:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.permission_probe && !inputs.review_archive_pilot && !inputs.pr_body_pages_pilot && !inputs.pr_body_positive_canary && !inputs.pr_body_reconciliation && !inputs.manual_v02_only && !inputs.manual_inventory_only) }}
    needs: inventory-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Assert existing archive GitHub App is configured
        shell: bash
        env:
          SOURCE_ID: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          SOURCE_KEY: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          ARCHIVE_ID: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          ARCHIVE_KEY: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_ID" || -z "$SOURCE_KEY" ]]; then
            echo "::error::The shared GitHub App is not configured in this runner."
            exit 1
          fi
          if [[ -z "$ARCHIVE_ID" || -z "$ARCHIVE_KEY" ]]; then
            echo "::error::The shared GitHub App is not configured in this runner."
            exit 1
          fi

      - name: Create source Issues-and-PR-read token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: fleet-source
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          permission-issues: read
          permission-pull-requests: read

      - name: Create archive Contents-write token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: archive-write
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          repositories: github-history-archive
          permission-contents: write

      - name: Check out the reviewed immutable collector code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: ${{ env.ARCHIVE_COLLECTOR_REF }}
          token: ${{ steps.archive-write.outputs.token }}
          path: history-collector
          persist-credentials: false
      - name: Check out the exact shared inventory generation (data only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: ${{ needs.inventory-refresh.outputs.generation }}
          token: ${{ steps.archive-write.outputs.token }}
          path: history-code
          persist-credentials: false
          sparse-checkout: config

      - name: Check out current private archive for evidence writes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: main
          token: ${{ steps.archive-write.outputs.token }}
          path: history-archive
          persist-credentials: true

      - name: Fleet sweep with per-repository retries and durable checkpoints
        shell: bash
        working-directory: history-archive
        env:
          FLEET_SOURCE_TOKEN: ${{ steps.fleet-source.outputs.token }}
          MANUAL_FIRST: ${{ inputs.start_source_index }}
          MANUAL_LAST: ${{ inputs.end_source_index }}
          INVENTORY_GENERATION: ${{ needs.inventory-refresh.outputs.generation }}
          INVENTORY_ALLOWED: ${{ needs.inventory-refresh.outputs.allowed_indices }}
          INVENTORY_MODE: ${{ needs.inventory-refresh.outputs.mode }}
        run: |
          set -euo pipefail
          export PYTHONPATH=../history-collector/src
          inventory=../history-code/config/fleet-repositories.txt
          git config user.name "github-history-archive automation"
          git config user.email "github-history-archive-automation@users.noreply.github.com"
          if [[ "$(git -C ../history-collector rev-parse HEAD)" != "$ARCHIVE_COLLECTOR_REF" ]] || [[ -n "$(git -C ../history-collector status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Reviewed collector checkout is not verified"; exit 1
          fi
          if [[ -z "${INVENTORY_ALLOWED:-}" || ( "$INVENTORY_MODE" != REFRESHED && "$INVENTORY_MODE" != DEGRADED ) ]]; then
            echo "::error::Shared inventory receipt missing"; exit 1
          fi
          if ! selection=$(python -P -B -m history_archive.inventory_commit inspect --checkout ../history-code --expected-commit "$INVENTORY_GENERATION" --allowed-indices-json "$INVENTORY_ALLOWED"); then
            echo "::error::Shared inventory generation is not verified"
            exit 1
          fi
          total=$(printf '%s' "$selection" | jq -er 'select(.state == "VERIFIED") | .source_count | select(type == "number" and . > 0)')
          # Only manual dispatch may narrow a source range. Scheduled sweeps always use all sources.
          first=1
          last="$total"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            first="${MANUAL_FIRST:-1}"
            last="${MANUAL_LAST:-0}"
            if [[ ! "$first" =~ ^[1-9][0-9]*$ || ! "$last" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Invalid bounded source range."
              exit 2
            fi
            if [[ "$last" == "0" ]]; then last="$total"; fi
            if (( first > last || last > total )); then
              echo "::error::Source range exceeds configured inventory."
              exit 2
            fi
          fi
          range_count=$((last - first + 1))
          failures=0
          unavailable_count=0
          success_count=0
          recovered_count=0
          scan_mode=hourly
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && ( "${{ inputs.full_collection }}" == "true" || "${{ inputs.manual_all_seven }}" == "true" || "${{ inputs.tail_collection }}" == "true" ) ]] || [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "37 4 * * *" ]]; then
            scan_mode=tail
          fi
          # Temporary sanitized per-attempt diagnostics only; never source content.
          safe_scan_log="$(mktemp)"
          trap 'rm -f "$safe_scan_log"' EXIT
          scan_args=()
          if [[ "$scan_mode" == "tail" ]]; then scan_args+=(--all); fi
          for index in $(seq "$first" "$last"); do
            if ! printf '%s' "$selection" | jq -e --argjson i "$index" '.available_indices | index($i) != null' >/dev/null; then
              unavailable_count=$((unavailable_count + 1))
              echo "::warning::Source index $index unavailable in verified inventory; no completion inferred."
              continue
            fi
            scanned=0
            for scan_attempt in 1 2 3; do
              if python -P -B -m history_archive.fleet_cli --root . \
                  --sources "$inventory" "${scan_args[@]}" --source-index "$index" 2>&1 \
                  | jq -Rc 'try (fromjson | del(.repository, .error, .path, .source)) catch {"collector_output":"redacted"}' | tee "$safe_scan_log"; then
                scanned=1
                if [[ "$scan_attempt" -gt 1 ]]; then recovered_count=$((recovered_count + 1)); fi
                break
              fi
              # The collector already waits when GitHub supplies a bounded reset.
              # If still rate-limited, preserve the source failure and defer its retry.
              if grep -Eq '"error_code":"(graphql_rate_limit|rate_limited(_until_[0-9TZ]+)?)"' "$safe_scan_log"; then
                echo "::warning::Source index $index is rate-limited; no blind immediate retry."
                break
              fi
              echo "::warning::Source index $index scan failed (attempt $scan_attempt/3)."
              if [[ "$scan_attempt" -lt 3 ]]; then
                sleep "$((scan_attempt * 15))"
              fi
            done
            if [[ "$scanned" -eq 1 ]]; then
              success_count=$((success_count + 1))
            else
              failures=$((failures + 1))
              echo "::error::Source index $index could not be scanned after three attempts."
            fi
            git add -A -- archive/ tracking/ 2>/dev/null || git add -A -- archive/ 2>/dev/null
            if ! git diff --cached --quiet; then
              unexpected="$(git diff --cached --name-only | grep -Ev '^(archive|tracking)/' || true)"
              if [[ -n "$unexpected" ]]; then
                echo "::error::Unexpected staged path outside archive/tracking."
                exit 2
              fi
              git commit -qm "archive: $scan_mode checkpoint $index/$total"
              pushed=0
              for attempt in 1 2 3 4; do
                if git pull -q --rebase origin main >/dev/null 2>&1 && git push -q origin HEAD:main >/dev/null 2>&1; then
                  pushed=1
                  break
                fi
                git rebase --abort >/dev/null 2>&1 || true
                sleep "$((attempt * 2))"
              done
              if [[ "$pushed" -ne 1 ]]; then
                echo "::error::Checkpoint push failed at source index $index."
                exit 1
              fi
            fi
            echo "Fleet $scan_mode checkpoint $index/$total processed."
          done
          {
            echo "### Archive fleet collection receipt"
            echo "- Mode: $scan_mode"
            echo "- Inventory refresh mode: $INVENTORY_MODE"
            echo "- Configured sources: $total"
            echo "- Requested source indices: $first-$last (count: $range_count)"
            echo "- Unavailable (not attempted): $unavailable_count"
            echo "- Succeeded: $success_count"
            echo "- Recovered after retry: $recovered_count"
            echo "- Failed after retries: $failures"
            echo "- Archive checkpoint writes: see committed archive history"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( failures + unavailable_count > 0 )); then
            echo "::error::$((failures + unavailable_count)) sources were not completely scanned."
            exit 1
          fi
          if [[ "$INVENTORY_MODE" == DEGRADED ]]; then
            echo "::warning::Existing sources preserved; inventory refresh remains incomplete."; exit 1
          fi

      - name: Report private fleet scan freshness as aggregate counts
        if: always()
        shell: bash
        working-directory: history-archive
        run: |
          set -euo pipefail
          export PYTHONPATH=../history-collector/src
          if [[ ! -f ../history-code/config/fleet-repositories.txt ]]; then
            echo "::warning::Fleet inventory not available for health report."
            exit 0
          fi
          if ! python -P -B -m history_archive.fleet_health \
              --root . --sources ../history-code/config/fleet-repositories.txt --max-age-hours 24 \
              | jq -r '["### Durable fleet scan health", ("- Sources: " + (.sources|tostring)), ("- Recent success: " + (.recent_success|tostring)), ("- Stale: " + (.stale_success|tostring)), ("- No success: " + (.never_succeeded|tostring)), ("- Failed: " + (.failed_last_attempt|tostring)), ("- Deferred: " + (.deferred|tostring))] | .[]' \
              >> "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Fleet health report unavailable; no success inferred."
          fi

      - name: Fail run if a source was not fully checked
        if: always()
        shell: bash
        env:
          FLEET_SCAN_FAILED: ${{ env.FLEET_SCAN_FAILED }}
        run: |
          if [[ "$FLEET_SCAN_FAILED" == "1" ]]; then
            echo "::error::At least one source could not be scanned; partial evidence was preserved."
            exit 1
          fi

  archive-v02-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.manual_all_seven || inputs.manual_v02_only) && !inputs.manual_inventory_only && !inputs.permission_probe && !inputs.review_archive_pilot && !inputs.pr_body_pages_pilot && !inputs.pr_body_positive_canary && !inputs.pr_body_reconciliation }}
    needs: inventory-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Create existing read-only source App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source-read
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          permission-issues: read
          permission-pull-requests: read
      - name: Create existing archive-only private write token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: archive-write
        with:
          client-id: ${{ vars.HISTORY_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_ARCHIVE_APP_PRIVATE_KEY }}
          owner: kinoko34077
          repositories: github-history-archive
          permission-contents: write
      - name: Check out the reviewed immutable collector code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: ${{ env.ARCHIVE_COLLECTOR_REF }}
          token: ${{ steps.archive-write.outputs.token }}
          path: history-collector
          persist-credentials: false
      - name: Check out the exact shared inventory generation (data only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: ${{ needs.inventory-refresh.outputs.generation }}
          token: ${{ steps.archive-write.outputs.token }}
          path: history-code
          persist-credentials: false
          sparse-checkout: config
      - name: Check out private checkpoint workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinoko34077/github-history-archive
          ref: main
          token: ${{ steps.archive-write.outputs.token }}
          path: history-evidence
          persist-credentials: true
      - name: Manually preserve five additional edit-history kinds in bounded resumable lanes
        shell: bash
        working-directory: history-evidence
        env:
          FLEET_SOURCE_TOKEN: ${{ steps.source-read.outputs.token }}
          SOURCE_FIRST: ${{ inputs.start_source_index }}
          SOURCE_LAST: ${{ inputs.end_source_index }}
          MAX_V02_PAGES: ${{ inputs.manual_v02_pages }}
          MAX_V02_CYCLES: ${{ inputs.manual_v02_cycles }}
          V02_PAUSE_SECONDS: ${{ inputs.manual_v02_pause_seconds }}
          RECONCILE_COMPLETE: ${{ inputs.manual_reconcile_complete }}
          RECONCILE_BEFORE: ${{ inputs.manual_reconcile_before }}
          INVENTORY_GENERATION: ${{ needs.inventory-refresh.outputs.generation }}
          INVENTORY_ALLOWED: ${{ needs.inventory-refresh.outputs.allowed_indices }}
          INVENTORY_MODE: ${{ needs.inventory-refresh.outputs.mode }}
        run: |
          set -euo pipefail
          inventory=../history-code/config/fleet-repositories.txt
          export PYTHONPATH=../history-collector/src
          if [[ "$(git -C ../history-collector rev-parse HEAD)" != "$ARCHIVE_COLLECTOR_REF" ]] || [[ -n "$(git -C ../history-collector status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Reviewed collector checkout is not verified"; exit 1
          fi
          if [[ -z "${INVENTORY_ALLOWED:-}" || ( "$INVENTORY_MODE" != REFRESHED && "$INVENTORY_MODE" != DEGRADED ) ]]; then
            echo "::error::Shared inventory receipt missing"; exit 1
          fi
          if ! selection=$(python -P -B -m history_archive.inventory_commit inspect --checkout ../history-code --expected-commit "$INVENTORY_GENERATION" --allowed-indices-json "$INVENTORY_ALLOWED"); then
            echo "::error::Shared inventory generation is not verified"
            exit 1
          fi
          total=$(printf '%s' "$selection" | jq -er 'select(.state == "VERIFIED") | .source_count | select(type == "number" and . > 0)')
          first="${SOURCE_FIRST:-1}"
          last="${SOURCE_LAST:-0}"
          if [[ "$last" == "0" ]]; then last="$total"; fi
          if [[ ! "$first" =~ ^[1-9][0-9]*$ || ! "$last" =~ ^[1-9][0-9]*$ ]] || (( first > last || last > total )); then
            echo '::error::Invalid manual source index range'; exit 2
          fi
          if [[ ! "$MAX_V02_PAGES" =~ ^[1-5]$ ]]; then
            echo '::error::Invalid bounded per-lane page limit'; exit 2
          fi
          if [[ ! "${MAX_V02_CYCLES:-1}" =~ ^(1[0-2]|[1-9])$ ]]; then
            echo '::error::Invalid v0.2 cycle count (1-12)'; exit 2
          fi
          if [[ ! "${V02_PAUSE_SECONDS:-5}" =~ ^([0-9]|[1-5][0-9]|60)$ ]]; then
            echo '::error::Invalid v0.2 pause seconds (0-60)'; exit 2
          fi
          # A fixed timestamp is supplied by the trusted dispatch adapter.
          # Reject conflicts and malformed input before any lane can write.
          if [[ -n "${RECONCILE_BEFORE:-}" ]]; then
            if [[ "$RECONCILE_COMPLETE" == 'true' || ! "$RECONCILE_BEFORE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo '::error::Invalid or conflicting reconciliation cutoff'; exit 2
            fi
            if ! date -u -d "$RECONCILE_BEFORE" +%s >/dev/null 2>&1; then
              echo '::error::Invalid reconciliation timestamp'; exit 2
            fi
          fi
          # Leave headroom for checkout, verified private writes and cleanup.
          started_at=$(date +%s)
          deadline=$((started_at + 45 * 60))
          git config user.name 'github-history-archive automation'
          git config user.email 'github-history-archive-automation@users.noreply.github.com'
          # One state per source/type, independent of the other four lanes.
          # First visit every eligible lane, then continue ACTIVE lanes in
          # bounded rounds. Failed lanes are deferred to one final retry.
          declare -A states=() observed=() errors=()
          lanes=(pr-body pr-comment pr-review-body pr-review-comment commit-comment)
          deadline_reached=0
          # Keep every numeric index; quarantine unavailable names without
          # changing their branch identity or inferring a completed lane.
          for index in $(seq "$first" "$last"); do
            if ! printf '%s' "$selection" | jq -e --argjson i "$index" '.available_indices | index($i) != null' >/dev/null; then
              for lane in "${lanes[@]}"; do
                states["$index/$lane"]=UNAVAILABLE
              done
            fi
          done

          check_clean() {
            local status dirty
            status=$(git status --porcelain --untracked-files=all)
            dirty=$(printf '%s\n' "$status" | grep -v '^?? .locks/' || true)
            if [[ -n "$dirty" ]]; then
              echo "::error::$1"; exit 1
            fi
          }

          verify_lane_exit() {
            local before="$1" branch="$2" message="$3" after remote
            check_clean "$message"
            after=$(git rev-parse HEAD)
            if [[ "$before" != "$after" ]]; then
              # A local commit can be clean even if its push failed. Do not
              # reset/switch away until the exact remote checkpoint is proven.
              if ! remote=$(git ls-remote --exit-code origin "refs/heads/$branch" 2>/dev/null); then
                echo '::error::Unverified private commit prevents safe branch switch'; exit 1
              fi
              if [[ "${remote%%[[:space:]]*}" != "$after" ]]; then
                echo '::error::Unverified private commit prevents safe branch switch'; exit 1
              fi
            fi
          }

          run_lane() {
            local index="$1" lane="$2" phase="$3" key source_num branch summary state code rc before
            key="$index/$lane"
            if (( $(date +%s) >= deadline )); then
              deadline_reached=1
              return 0
            fi
            printf -v source_num '%03d' "$index"
            branch="manual/v02-s${source_num}-${lane}"
            check_clean 'Unpushed private evidence prevents safe branch switch'
            if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
              git fetch -q --no-tags origin "refs/heads/$branch"
              git switch -q -C "$branch" FETCH_HEAD
            else
              rc=$?
              if (( rc != 2 )); then
                echo '::error::Cannot verify private evidence branch'; exit 1
              fi
              git switch -q -C "$branch" origin/main
            fi
            before=$(git rev-parse HEAD)
            local args=(--inventory "$inventory" --checkout . --source-index "$index" --lane "$lane" --max-pages "$MAX_V02_PAGES")
            # Reconcile at most once after a confirmed successful invocation.
            # An unconfirmed failed first attempt must not masquerade as a
            # successful reconciliation of an old COMPLETE generation.
            if [[ -z "${observed[$key]:-}" ]]; then
              if [[ "$RECONCILE_COMPLETE" == 'true' ]]; then
                args+=(--reconcile-complete)
              elif [[ -n "${RECONCILE_BEFORE:-}" ]]; then
                args+=(--reconcile-before "$RECONCILE_BEFORE")
              fi
            fi
            if summary=$(python -P -B -m history_archive.v02_manual_fleet "${args[@]}" 2>&1); then
              if ! state=$(printf '%s' "$summary" | jq -er '.state' 2>/dev/null); then
                echo '::error::Invalid sanitized v0.2 lane summary'; exit 1
              fi
              if [[ "$state" != COMPLETE && "$state" != ACTIVE ]]; then
                echo '::error::Unexpected v0.2 lane state'; exit 1
              fi
              verify_lane_exit "$before" "$branch" 'Unpushed private evidence prevents safe branch switch'
              states[$key]="$state"
              observed[$key]=1
              unset 'errors[$key]'
              echo "v0.2 index=$index phase=$phase lane=$lane state=$state"
            else
              # The collector emits a sanitized JSON error, but allowlist
              # again before logging. Never print raw stderr or API content.
              code=$(printf '%s' "$summary" | jq -er '.error_code' 2>/dev/null || true)
              case "$code" in
                BAD_SOURCE_INDEX|BAD_LANE|BAD_PAGE_LIMIT|NO_SOURCE_TOKEN|FAILED_FRONTIER|SOURCE_OR_CHECKPOINT_FAILURE) ;;
                *) code=UNCLASSIFIED_FAILURE ;;
              esac
              states[$key]=FAILED
              errors[$key]="$code"
              echo "::warning::v0.2 index=$index lane=$lane phase=$phase FAILED or UNAVAILABLE; no completion inferred; code=$code"
              verify_lane_exit "$before" "$branch" 'Failed source left unpushed evidence; abort before switching'
              case "$code" in
                BAD_SOURCE_INDEX|BAD_LANE|BAD_PAGE_LIMIT|NO_SOURCE_TOKEN)
                  echo '::error::Global collector configuration failure'; exit 1 ;;
              esac
            fi
          }

          for ((cycle=1; cycle<=${MAX_V02_CYCLES:-1}; cycle++)); do
            active=0
            for index in $(seq "$first" "$last"); do
              for lane in "${lanes[@]}"; do
                key="$index/$lane"
                case "${states[$key]:-NOT_SCANNED}" in
                  COMPLETE|FAILED) continue ;;
                  UNAVAILABLE) continue ;;
                esac
                run_lane "$index" "$lane" "round-$cycle"
                if (( deadline_reached )); then break 3; fi
                if [[ "${states[$key]}" == ACTIVE ]]; then active=1; fi
              done
            done
            if (( ! active )); then break; fi
            if (( cycle < ${MAX_V02_CYCLES:-1} )); then
              sleep "${V02_PAUSE_SECONDS:-5}"
            fi
          done

          # Exactly one retry, only for failed lanes, after healthy work.
          # The existing overall deadline remains authoritative.
          retries=0
          if (( ! deadline_reached )); then
            for index in $(seq "$first" "$last"); do
              for lane in "${lanes[@]}"; do
                key="$index/$lane"
                if [[ "${states[$key]:-}" != FAILED ]]; then continue; fi
                run_lane "$index" "$lane" retry
                if (( deadline_reached )); then break 2; fi
                retries=$((retries + 1))
              done
            done
          fi

          complete=0
          partial=0
          fail=0
          unattempted=0
          unavailable=0
          total_lanes=$(( (last - first + 1) * 5 ))
          {
            echo '### Manual F4 v0.2 typed history collection'
            echo "- Inventory refresh mode: $INVENTORY_MODE"
            echo "- Inventory sources: $total"
            echo "- Requested source range: $first-$last"
            echo "- Max normal rounds: ${MAX_V02_CYCLES:-1}"
            echo "- Final retries attempted: $retries"
            echo "- Deadline reached: $deadline_reached"
            for index in $(seq "$first" "$last"); do
              for lane in "${lanes[@]}"; do
                key="$index/$lane"
                case "${states[$key]:-NOT_SCANNED}" in
                  COMPLETE) complete=$((complete + 1)) ;;
                  ACTIVE) partial=$((partial + 1)); echo "- ACTIVE: $key" ;;
                  FAILED) fail=$((fail + 1)); echo "- FAILED: $key (${errors[$key]})" ;;
                  UNAVAILABLE) unavailable=$((unavailable + 1)); echo "- UNAVAILABLE: $key" ;;
                  *) unattempted=$((unattempted + 1)); echo "- NOT_ATTEMPTED: $key" ;;
                esac
              done
            done
            echo "- Complete lanes: $complete/$total_lanes"
            echo "- Active lanes: $partial"
            echo "- Final failed lanes: $fail"
            echo "- Unattempted lanes: $unattempted"
            echo "- Unavailable lanes: $unavailable"
            if [[ "${{ inputs.manual_v02_only }}" == 'true' ]]; then
              echo '- v0.1 Issue body/comment fleet deliberately skipped for this delta-only dispatch'
            else
              echo '- v0.1 Issue body/comment fleet runs separately in the same seven-kind dispatch'
            fi
            echo '- Partial, failed or unattempted lanes are NOT seven-kind archival acceptance.'
            echo '- Resume from existing private checkpoints; no history or frontier is reset.'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( unavailable > 0 )); then
            echo "::error::$unavailable typed source-lanes unavailable in verified inventory"; exit 1
          fi
          if (( fail > 0 )); then
            echo "::error::$fail typed source-lanes remain failed or unavailable"; exit 1
          fi
          if [[ "$INVENTORY_MODE" == DEGRADED ]]; then
            echo "::warning::Existing sources preserved; inventory refresh remains incomplete."; exit 1
          fi
