name: pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "src/repo_monitor/devflow_state.py"
      - "src/repo_monitor/pages/**"
      - "tools/build_pages.py"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build public snapshot and static site
        env:
          PYTHONPATH: src
          REPO_MONITOR_PUBLIC_READ_TOKEN: ${{ github.token }}
        run: python tools/build_pages.py --output _site
      - name: Checkout canonical devflow SMC GET-only producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kinoko34077/devflow
          path: _smc_devflow
          persist-credentials: false
      - name: Build public three-PILOT SMC snapshot (fail-closed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMC_TEMP_REPORT: ${{ runner.temp }}/smc-coverage-report.json
        run: |
          python _smc_devflow/scripts/maintenance_coverage_report.py \
            --repo-ledger 'kinoko34077/devflow#367' \
            --repo-ledger 'kinoko34077/execution-coordinator#127' \
            --repo-ledger 'kinoko34077/kinotch-repository-base#50' \
            --format json --output "$SMC_TEMP_REPORT"
          python tools/build_public_smc.py --report "$SMC_TEMP_REPORT" \
            --upstream _smc_devflow --output _site/smc/index.html
          rm -f "$SMC_TEMP_REPORT"
      - name: Run Pages contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_pages_build.py" -v
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
