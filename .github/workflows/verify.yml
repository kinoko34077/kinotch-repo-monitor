name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m compileall -q src tests
      - run: python -m repo_monitor --smoke
        env:
          PYTHONPATH: src
