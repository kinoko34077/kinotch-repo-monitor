name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cmd /c verify.cmd
      - run: cmd /c run.cmd --smoke
      - run: cmd /c _run_python.cmd tools\benchmark_refresh.py
      - run: cmd /c _run_python.cmd tools\benchmark_cached_state.py
      - run: cmd /c _run_python.cmd tools\browser_interaction_check.py
      - run: cmd /c _run_python.cmd tools\render_check.py --require-browser --screenshot web-render.png
      - run: cmd /c _run_python.cmd tools\browser_audit.py --demo --output browser-audit.json --screenshot browser-audit.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repo-monitor-web-render
          path: web-render.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repo-monitor-browser-audit
          path: |
            browser-audit.json
            browser-audit.png
          if-no-files-found: ignore
